<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Income - Personal Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        {% include 'includes/sidebar.html' %}
        <main class="main-content">
            <h1>➕ Add Income</h1>
            <p>Record your earnings</p>
            <div class="form-card">
                <form action="/api/transactions" method="POST">
                    <input type="hidden" name="type" value="income">
                    <div class="form-group">
                        <label>Category</label>
                        <select name="category" required>
                            <option value="Salary">💼 Salary</option>
                            <option value="Freelancing">💻 Freelancing</option>
                            <option value="Scholarship">🎓 Scholarship</option>
                            <option value="Gift">🎁 Gift</option>
                            <option value="Other">💰 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" name="amount" placeholder="35,000" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" name="description" placeholder="Monthly salary from XYZ Corp">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <button type="submit">Add Income</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
