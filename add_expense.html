<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Personal Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        {% include 'includes/sidebar.html' %}
        <main class="main-content">
            <h1>💸 Add Expense</h1>
            <p>Track your spending</p>
            <div class="form-card">
                <form action="/api/transactions" method="POST">
                    <input type="hidden" name="type" value="expense">
                    <div class="form-group">
                        <label>Category</label>
                        <select name="category" required>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚕 Transport</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Rent">🏠 Rent</option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Bills">💡 Bills</option>
                            <option value="Education">📚 Education</option>
                            <option value="Others">📦 Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" name="amount" placeholder="450" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" name="description" placeholder="Pizza dinner with friends">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <button type="submit">Add Expense</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
